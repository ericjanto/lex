[tool.ruff]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP", # pyupgrade
]
line-length = 79 # Same as Black.
target-version = "py311"
exclude = [
    "uncommitted",
]

[tool.black]
line-length = 79
preview = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 79
profile = "black"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "uncommitted",
]
